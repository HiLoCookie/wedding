<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotogalerie</title>
  <meta name="description" content="Fotky nás dvou, z Japonska a našich mazlíčků.">
  <link rel="icon" href="assets/hanko.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page">
  <nav class="nav" aria-label="Hlavní navigace">
    <a href="index.html">← Zpět na svatbu</a>
    <a href="index.html#rsvp" class="nav-cta">RSVP</a>
  </nav>

  <main class="section wide">
    <h1 class="title"><span class="jp">写真</span>Fotogalerie</h1>
    <p class="center muted">Kliknutím fotku zvětšíte, šipkami nebo přejetím prstem listujete.</p>

    <div class="filters" role="tablist" aria-label="Filtr fotek"></div>
    <div class="masonry" id="masonry"></div>
  </main>

  <footer class="footer">
    <img src="assets/hanko.svg" alt="" width="56" height="56">
    <p><a href="index.html">Zpět na hlavní stránku</a></p>
  </footer>

  <script src="config.js"></script>
  <script src="gallery-data.js"></script>
  <script src="lightbox.js"></script>
  <script>
  (function () {
    'use strict';
    const C = window.WEDDING;
    document.title = `Fotogalerie – ${C.couple.a} & ${C.couple.b}`;

    const FILTERS = [
      { id: 'vse', label: 'Všechny' },
      { id: 'my', label: 'My dva' },
      { id: 'japonsko', label: 'Japonsko 🇯🇵' },
      { id: 'loki', label: 'Loki' },
      { id: 'himiko', label: 'Himiko' },
      { id: 'psi', label: 'Lucky & Dusty' },
    ];
    const all = window.GALLERY;
    const box = document.getElementById('masonry');
    const bar = document.querySelector('.filters');
    let current = [];

    bar.innerHTML = FILTERS.map(f => {
      const n = f.id === 'vse' ? all.length : all.filter(p => p.t.includes(f.id)).length;
      return `<button type="button" role="tab" data-f="${f.id}">${f.label} <small>${n}</small></button>`;
    }).join('');

    function render(id) {
      if (!FILTERS.some(f => f.id === id)) id = 'vse';
      current = id === 'vse' ? all : all.filter(p => p.t.includes(id));
      bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.f === id));
      box.innerHTML = current.map((p, i) => `
        <button type="button" class="m-item" data-i="${i}" aria-label="Zvětšit fotku ${i + 1}">
          <img src="assets/gallery/thumb/${p.f}" width="${p.w}" height="${p.h}" loading="lazy" alt="">
        </button>`).join('');
    }

    bar.addEventListener('click', e => {
      const b = e.target.closest('[data-f]');
      if (!b) return;
      history.replaceState(null, '', b.dataset.f === 'vse' ? location.pathname : '#' + b.dataset.f);
      render(b.dataset.f);
    });
    box.addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (!b) return;
      Lightbox.open(current.map(p => ({ src: 'assets/gallery/full/' + p.f })), +b.dataset.i);
    });
    window.addEventListener('hashchange', () => render(location.hash.slice(1)));
    render(location.hash.slice(1));
  })();
  </script>
</body>
</html>
